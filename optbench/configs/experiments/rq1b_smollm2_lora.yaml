# RQ1 robustness check: does the optimizer ranking transfer to a SECOND, architecturally
# different model? GPT-2 is GPT-style; SmolLM2-360M is Llama-style (RoPE/SwiGLU). Same fair
# protocol, lighter budget: a coarse 7-point LR re-tune per optimizer + K=3 seeds on the best.
# The question is the RANKING, not a new absolute number — either outcome is a result:
# holds -> protocol transfers; breaks -> AlgoPerf's "one task is not enough" shown firsthand.
name: rq1b_smollm2_lora
rq: rq1

workload:
  name: smollm2_wikitext2_lora
  task: causal_lm
  model_kind: hf_causal
  model_name: HuggingFaceTB/SmolLM2-360M
  seq_len: 256
  micro_batch_size: 8
  grad_accum_steps: 1
  eval_metric: val_loss
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj]   # Llama attention (mirrors GPT-2 c_attn = QKV)
  extras:
    max_train_blocks: 2000
    max_eval_blocks: 128

budget:
  kind: steps
  max_steps: 500
  eval_every_steps: 100
  warmup_ratio: 0.05
  scheduler: cosine
  grad_clip: 1.0

optimizers:
  - {name: sgd_momentum, defaults: {momentum: 0.9, nesterov: true}}
  - {name: adamw,        defaults: {betas: [0.9, 0.999], weight_decay: 0.01}}
  - {name: lion,         defaults: {betas: [0.9, 0.99], weight_decay: 0.0}}
  - {name: sophia,       defaults: {rho: 0.04, betas: [0.965, 0.99]}}

# Coarse re-tune (7 log-spaced points), each bracketing the GPT-2 optimum +-1 order.
search_spaces:
  sgd_momentum:
    optimizer: sgd_momentum
    n_trials: 7
    ranges: [{name: lr, kind: log_uniform, low: 1.0e-2, high: 1.0}]
  adamw:
    optimizer: adamw
    n_trials: 7
    ranges: [{name: lr, kind: log_uniform, low: 1.0e-4, high: 1.0e-2}]
  lion:
    optimizer: lion
    n_trials: 7
    ranges: [{name: lr, kind: log_uniform, low: 3.0e-5, high: 3.0e-3}]
  sophia:
    optimizer: sophia
    n_trials: 7
    ranges: [{name: lr, kind: log_uniform, low: 1.0e-4, high: 1.0e-2}]

seeds:
  sweep_seed: 0
  final_seeds: [0, 1, 2]

# Recalibrated from histories (same AlgoPerf-style rule as GPT-2): a small margin above
# the slowest optimizer's floor (SGD ~2.477) so all seeds of all optimizers reach it.
target_metric_value: 2.48

runtime:
  device: cuda
  precision: bf16
  results_root: results/runs
