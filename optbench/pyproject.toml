[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optbench"
version = "0.1.0"
description = "Fair benchmarking and visualization of optimizers for LLM fine-tuning"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "peft",
  "datasets",
  "accelerate",
  "numpy<2.3",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "pyyaml",
  "pandas",
  "lion-pytorch",
  "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
